exclude: '^docs/_build/'

repos:

  - repo: https://github.com/kynan/nbstripout
    rev: 0.8.1
    hooks:
      - id: nbstripout

  - repo: local
    hooks:
      - id: jupytext  # sync .py scripts from notebooks BEFORE formatting
        name: jupytext
        entry: uv run jupytext --sync
        language: system
        files: '\.ipynb$'

  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v6.0.0
    hooks:
      - id: trailing-whitespace
      - id: end-of-file-fixer
      - id: check-yaml
      - id: check-toml
      - id: check-merge-conflict
      - id: check-added-large-files
        args: [--maxkb=1000]
      - id: debug-statements

  - repo: local
    hooks:
      - id: ruff-format
        name: ruff format
        entry: uv run ruff format
        language: system
        types_or: [python, pyi, jupyter]
      - id: ruff-check
        name: ruff check
        entry: uv run ruff check --fix --exit-non-zero-on-fix
        language: system
        types_or: [python, pyi, jupyter]

  - repo: local
    hooks:
      - id: jupytext  # re-sync AFTER ruff reformats the paired .py scripts
        name: jupytext
        entry: uv run jupytext --sync
        language: system
        files: '\.ipynb$'

  - repo: local
    hooks:
      - id: basedpyright
        name: basedpyright
        entry: uv run basedpyright
        language: system
        types_or: [python, pyi, jupyter]
        exclude: ^tests/
